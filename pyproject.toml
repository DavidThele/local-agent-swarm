[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-core"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
	"chromadb>=1.0.0",
	"google-genai",
	"numpy>=2.4.6",
	"pillow>=13.0.0",
	"playwright>=1.65.2",
	"pynput>=1.8.2",
	"pyobjc-core>=13.0",
	"pyobjc-framework-applicationservices>=13.0",
	"pyobjc-framework-cocoa>=13.0",
	"pyobjc-framework-quartz>=13.0",
	"pyobjc-framework-webkit>=13.0",
	"python-dotenv>=1.2.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
	"infrastructure*",
	"pipelines*",
	"command_executors*",
	"db*",
	"commands*",
	"prompts*",
	"config*",
	"macro_synth*",
]

[tool.setuptools.package-data]
commands = ["*.md"]
prompts = ["*.md"]
config = ["*.md"]

[tool.pyright]
reportAttributeAccessIssue = "none"

[dependency-groups]
dev = [
    "ipython>=9.18.1",
]
