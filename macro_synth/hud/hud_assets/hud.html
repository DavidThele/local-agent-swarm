<!DOCTYPE html>
<html>
    <head>
      <meta charset="utf-8">
      <style>
        :root {
          --scale: __HUD_SCALE__;
        }
        __HUD_CSS__
      </style>
    </head>
    <body>
      <div id="scaler">
        <div id="hud-root" class="hud-hidden">
          <!-- State 3 Pop-out Semi-Circular Wheel -->
          <div id="wheel-wrapper">
            <div id="wheel-bg"></div>
            <div id="wheel-slots"></div>
          </div>
    
          <!-- Main Pill Bar -->
          <div id="main-bar">
            <div id="text-area-container">
              <input id="hud-input" type="text" placeholder="Specify request..." autocomplete="off" spellcheck="false" />
              <div id="status-label" class="hidden">Processing...</div>
            </div>
    
            <div id="right-icon-slot">
              <!-- Arrow Button (States 1 & 4) -->
              <div id="submit-btn" class="icon-btn" title="Submit">
                <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                  <path d="M3 7H11M11 7L7.5 3.5M11 7L7.5 10.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
    
              <!-- Spinning 10-Point Starburst Icon (States 2 & 3) -->
              <div id="spinner-icon" class="icon-btn hidden">
                <svg id="spinner-svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 1L14.2 4.5L18.5 3.1L18.4 7.4L22.5 8.6L20.1 12L22.5 15.4L18.4 16.6L18.5 20.9L14.2 19.5L12 23L9.8 19.5L5.5 20.9L5.6 16.6L1.5 15.4L3.9 12L1.5 8.6L5.6 7.4L5.5 3.1L9.8 4.5Z"/>
                </svg>
              </div>
            </div>
          </div>
    
          <!-- State 1 Context Pills Stack -->
          <div id="context-stack"></div>
        </div>
      </div>
    
      <script>
        __HUD_JS__
      </script>
    </body>
</html>
